[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reprompt"
version = "0.1.0"
description = "MCP tool proxy that intercepts, rewrites, and reports tool calls"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
reprompt = "reprompt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reprompt"]
# Ship the Rash transformers (.rkt) inside the package so the default
# rewrite hook can discover them at run time.
artifacts = ["*.rkt"]

# fastmcp is provided by Nix (nixpkgs python3Packages.fastmcp) at run time and
# is not always importable from the interpreter that runs mypy. The override
# only applies when the package cannot be found; when fastmcp is on the mypy
# search path, its real types are used.
[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true
