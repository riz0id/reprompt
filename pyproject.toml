[project]
name = "myproject"
version = "0.1.0"
description = "Python project with Nix-managed dependencies"
requires-python = ">=3.12"
# Dependencies are managed by Nix — add them to `projectDeps` in flake.nix,
# not here. This list stays empty so pip/uv never resolve anything.
dependencies = []

[project.scripts]
myproject = "myproject.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myproject"]

[tool.black]
line-length = 88

[tool.mypy]
strict = true
files = ["src"]
